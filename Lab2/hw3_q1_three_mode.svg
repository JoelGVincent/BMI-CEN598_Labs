<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="'Times New Roman', Times, serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>
  <rect x="20" y="20" width="720" height="380" fill="none" stroke="#111" stroke-width="2"/>

  <text x="40" y="50" font-size="17" fill="#111">continuous variable: <tspan font-style="italic">s</tspan> ∈ ℝ</text>
  <text x="40" y="74" font-size="17" fill="#111">output: <tspan font-style="italic">tick</tspan> : pure</text>

  <!-- initial arrow -->
  <text x="40" y="128" font-size="17" font-style="italic" fill="#111">s(0) := 0</text>
  <path d="M 80 138 C 100 170, 140 165, 158 183" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- modes -->
  <rect x="100" y="185" width="140" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="2.4"/>
  <text x="170" y="213" font-size="18" text-anchor="middle" fill="#111" font-family="Arial, Helvetica, sans-serif">m1</text>
  <text x="170" y="240" font-size="18" text-anchor="middle" font-style="italic" fill="#111">ṡ(t) = 1</text>

  <rect x="330" y="185" width="140" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="2.4"/>
  <text x="400" y="213" font-size="18" text-anchor="middle" fill="#111" font-family="Arial, Helvetica, sans-serif">m2</text>
  <text x="400" y="240" font-size="18" text-anchor="middle" font-style="italic" fill="#111">ṡ(t) = 1</text>

  <rect x="560" y="185" width="140" height="70" rx="14" fill="#fff" stroke="#111" stroke-width="2.4"/>
  <text x="630" y="213" font-size="18" text-anchor="middle" fill="#111" font-family="Arial, Helvetica, sans-serif">m4</text>
  <text x="630" y="240" font-size="18" text-anchor="middle" font-style="italic" fill="#111">ṡ(t) = 1</text>

  <!-- m1 -> m2 -->
  <path d="M 242 205 Q 285 165 328 205" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="285" y="152" font-size="17" text-anchor="middle" font-style="italic" fill="#111">s(t) = 1  /  tick</text>

  <!-- m2 -> m4 -->
  <path d="M 472 205 Q 515 165 558 205" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="515" y="152" font-size="17" text-anchor="middle" font-style="italic" fill="#111">s(t) = 2  /  tick</text>

  <!-- m4 -> m1 (reset) -->
  <path d="M 630 257 C 600 365, 200 365, 170 257" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="400" y="352" font-size="17" text-anchor="middle" font-style="italic" fill="#111">s(t) = 4  /  tick</text>
  <text x="400" y="376" font-size="17" text-anchor="middle" font-style="italic" fill="#111">s(t) := −3</text>

  <!-- output port -->
  <polygon points="740,208 764,220 740,232" fill="#111"/>
  <text x="752" y="198" font-size="19" text-anchor="middle" font-style="italic" fill="#111">tick</text>

  <!-- caption -->
  <text x="400" y="432" font-size="17" text-anchor="middle" fill="#111">Ticks at t = 1, 2, 4, 8, 9, 11, 15, 16, 18, 22, 23, …   (t ≡ 1, 2, 4 mod 7)</text>
  <text x="400" y="456" font-size="15" text-anchor="middle" fill="#444">s is not reset on m1→m2 or m2→m4; resetting to −3 on m4→m1 starts the next 7-second cycle</text>
</svg>
