<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="'Times New Roman', Times, serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="470" fill="#ffffff"/>

  <!-- outer box -->
  <rect x="20" y="20" width="720" height="380" fill="none" stroke="#111" stroke-width="2"/>

  <!-- declarations -->
  <text x="40" y="50" font-size="17" fill="#111">continuous variable: <tspan font-style="italic">s</tspan> ∈ ℝ</text>
  <text x="40" y="74" font-size="17" fill="#111">variable: <tspan font-style="italic">T</tspan> ∈ {1, 2, 4}</text>
  <text x="40" y="98" font-size="17" fill="#111">output: <tspan font-style="italic">tick</tspan> : pure</text>

  <!-- initial arrow -->
  <path d="M 110 175 C 180 175, 240 195, 306 215" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="40" y="150" font-size="17" font-style="italic" fill="#111">s(0) := 3</text>
  <text x="40" y="172" font-size="17" font-style="italic" fill="#111">T(0) := 4</text>

  <!-- mode -->
  <rect x="310" y="185" width="140" height="70" rx="14" fill="#ffffff" stroke="#111" stroke-width="2.4"/>
  <text x="380" y="213" font-size="18" text-anchor="middle" fill="#111" font-family="Arial, Helvetica, sans-serif">timer</text>
  <text x="380" y="240" font-size="18" text-anchor="middle" font-style="italic" fill="#111">ṡ(t) = 1</text>

  <!-- self-loop A (top): T < 4 -->
  <path d="M 340 185 C 290 95, 470 95, 420 185" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="560" y="128" font-size="17" text-anchor="middle" font-style="italic" fill="#111">s(t) ≥ T ∧ T &lt; 4  /  tick</text>
  <text x="560" y="152" font-size="17" text-anchor="middle" font-style="italic" fill="#111">s(t) := 0;  T := 2T</text>
  <line x1="468" y1="135" x2="448" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- self-loop B (bottom): T = 4 -->
  <path d="M 340 255 C 290 345, 470 345, 420 255" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="560" y="318" font-size="17" text-anchor="middle" font-style="italic" fill="#111">s(t) ≥ T ∧ T = 4  /  tick</text>
  <text x="560" y="342" font-size="17" text-anchor="middle" font-style="italic" fill="#111">s(t) := 0;  T := 1</text>
  <line x1="468" y1="318" x2="448" y2="305" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- output port -->
  <polygon points="740,208 764,220 740,232" fill="#111"/>
  <text x="752" y="198" font-size="19" text-anchor="middle" font-style="italic" fill="#111">tick</text>

  <!-- caption -->
  <text x="400" y="432" font-size="17" text-anchor="middle" fill="#111">Ticks at t = 1, 2, 4, 8, 9, 11, 15, 16, 18, 22, 23, …   (gaps: 1, 2, 4, 1, 2, 4, …)</text>
  <text x="400" y="456" font-size="15" text-anchor="middle" fill="#444">T cycles 4 → 1 → 2 → 4 → 1 → …;  starting with s(0) = 3 makes the first tick fire at t = 1</text>
</svg>
